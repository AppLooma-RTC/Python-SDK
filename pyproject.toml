[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applooma"
version = "0.1.1"
description = "AppLooma RTC Server SDK for Python — issue tokens and manage rooms from your backend"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AppLooma LLC" }]
keywords = ["applooma", "webrtc", "video", "voice", "live-streaming", "cpaas"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Conferencing",
]

[project.urls]
Homepage = "https://applooma.dev"
Documentation = "https://docs.applooma.dev/server/python"
Source = "https://github.com/AppLooma-RTC/Python-SDK"
Issues = "https://github.com/AppLooma-RTC/Python-SDK/issues"
