[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liolive"
version = "0.1.0"
description = "Lio Live Server SDK for Python — issue tokens and manage rooms from your backend"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AppLooma LLC" }]
keywords = ["lio-live", "webrtc", "video", "voice", "live-streaming"]

[project.urls]
Documentation = "https://applooma.dev/dashboard/docs"
